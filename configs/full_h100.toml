# Full POLLUX: prepare once, then train on two H100 with torchrun.
model = "Qwen/Qwen3.5-0.8B"
source_dir = "checkpoints/pollux-source"
full_dataset = true
prepared_data_dir = "checkpoints/pollux-full-data"
output_dir = "checkpoints/pollux-full-ce"
seed = 42
max_length = 4096
max_options = 5

# Effective batch size: 2 GPUs × 2 examples × 8 accumulation steps = 32.
epochs = 3.0
learning_rate = 1e-5
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 8
dataloader_num_workers = 4
gradient_checkpointing = true
logging_steps = 10
save_total_limit = 2

laya_rl = false
clearml = true
clearml_project = "jev-as-a-judge"
clearml_task_name = "Qwen3.5-0.8B POLLUX full CE"
