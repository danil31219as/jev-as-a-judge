# Small run with the optional Laya-style RLCD loss.
model = "Qwen/Qwen3.5-0.8B"
output_dir = "checkpoints/pollux-sample-rlcd"
full_dataset = false
samples = 100
test_samples = 20
seed = 42
max_length = 4096
max_options = 5
shuffle_buffer = 512

epochs = 3.0
learning_rate = 1e-5
per_device_train_batch_size = 1
per_device_eval_batch_size = 1
gradient_accumulation_steps = 8
dataloader_num_workers = 0
gradient_checkpointing = true
logging_steps = 10
save_total_limit = 2
laya_rl = true
rl_group_size = 4
rl_sigma_start = 0.4
rl_sigma_end = 0.1
clearml = false
