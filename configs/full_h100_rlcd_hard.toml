# Majority-vote one-hot CE + RLCD; reuses the prepared full-data split.
model = "Qwen/Qwen3.5-0.8B"
source_dir = "checkpoints/pollux-source"
full_dataset = true
prepared_data_dir = "checkpoints/pollux-full-data"
output_dir = "checkpoints/pollux-full-rlcd-hard"
seed = 42
max_length = 4096
max_options = 5

epochs = 3.0
learning_rate = 1e-5
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 8
dataloader_num_workers = 4
gradient_checkpointing = true
logging_steps = 10
save_total_limit = 2

hard_labels = true
laya_rl = true
rl_group_size = 4
rl_sigma_start = 0.4
rl_sigma_end = 0.1
clearml = true
clearml_project = "jev-as-a-judge"
clearml_task_name = "Qwen3.5-0.8B POLLUX full majority RLCD"
